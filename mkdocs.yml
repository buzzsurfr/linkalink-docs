site_name: Link-A-Link Field Guide
site_description: Unofficial documentation, parts catalog and build blueprints for the Link-A-Link 3D-printable modular arm system.
site_author: Theo Salvo
use_directory_urls: false
site_url: https://linkalink-docs.netlify.app/
repo_url: https://github.com/buzzsurfr/linkalink-docs
repo_name: buzzsurfr/linkalink-docs
edit_uri: edit/main/docs/
copyright: Unofficial community guide · not affiliated with 3D Printing Builds · Link-A-Link™ is their product · no STL files hosted here

theme:
  name: material
  font: false
  icon:
    logo: material/robot-industrial
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/lal-masses.js
  - javascripts/load-calc.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences

nav:
  - Home: index.md
  - Guide:
      - guide/index.md
      - guide/how-it-works.md
      - guide/printing.md
      - guide/materials.md
      - guide/hardware.md
      - guide/assembly.md
  - Blueprints:
      - blueprints/index.md
      - blueprints/starter-webcam-arm.md
      - blueprints/laptop-riser-arm.md
      - blueprints/podcast-mic-boom.md
      - blueprints/bedside-tablet-arm.md
      - blueprints/overhead-camera-rig.md
      - blueprints/creator-rig.md
      - blueprints/stacked-portable-monitors.md
      - blueprints/car-cupholder-phone.md
      - blueprints/workbench-helping-hands.md
      - blueprints/kitchen-wall-tablet.md
      - blueprints/design-your-own.md
      - blueprints/load-calculator.md
  - Parts:
      - parts/index.md
      - Base Mounts:
          - parts/bases/c-clamps.md
          - parts/bases/desk-bases.md
          - parts/bases/fixed-rotating-base.md
          - parts/bases/wall-mount.md
          - parts/bases/weighted-base.md
          - parts/bases/cup-holder.md
          - parts/bases/rail-system.md
      - Links:
          - parts/links/standard-links.md
          - parts/links/payload-links.md
          - parts/links/branch-links.md
          - parts/links/modular-link.md
          - parts/links/ball-joint-link.md
          - parts/links/cable-management.md
      - Payload Mounts:
          - parts/payloads/vesa.md
          - parts/payloads/quarter-twenty.md
          - parts/payloads/baby-pin.md
          - parts/payloads/phone-mount.md
          - parts/payloads/magsafe.md
          - parts/payloads/microphone.md
          - parts/payloads/laptop.md
          - parts/payloads/tensioned-clamps.md
          - parts/payloads/t-claw.md
          - parts/payloads/spring-clamp.md
  - Reference:
      - reference/engineering.md
      - reference/community.md
      - reference/kickstarter.md
      - reference/file-index.md
      - reference/print-plates.md
      - reference/update-log.md
      - reference/about.md
